name: Hello Python App to Docker
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Smoke Test
        working-directory: docker/app1-hello/python
        run: python -m py_compile main.py

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build # Fixed: Changed from build-test to match the job name above

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/app1-hello/python/Dockerfile # Fixed: Added /Dockerfile to point to the file, not just the folder
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/app1-hello-python:latest
